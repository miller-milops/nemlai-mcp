# Generated by scripts/build_agent_packages.py in the NemlAI repo; edit the sources there, not this file.
# Attaches nemlai-skill.zip (the skill, for upload to claude.ai and Claude Desktop) to every release.
name: skill zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nemlai-skill.zip
        run: cd plugin/skills && zip -X -r "$GITHUB_WORKSPACE/nemlai-skill.zip" nemlai
      - uses: actions/upload-artifact@v4
        with:
          name: nemlai-skill
          path: nemlai-skill.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" nemlai-skill.zip --clobber
